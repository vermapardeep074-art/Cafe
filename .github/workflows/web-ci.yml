name: Web CI & Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-web:
    name: Validate Web, SQL & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript Syntax
        run: |
          node -c public/supabase-client.js
          echo "✅ public/supabase-client.js syntax is valid."

      - name: Run Web Test Suite & Anti-XSS Verification
        run: |
          node tests/web-suite.test.js
